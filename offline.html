<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamList Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        color: #f8fafc;
        background:
          radial-gradient(circle at top left, rgba(59, 130, 246, 0.3), transparent 35%),
          radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.22), transparent 35%),
          #0f172a;
      }

      main {
        width: min(680px, calc(100% - 32px));
        padding: 32px;
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.86);
        border: 1px solid rgba(148, 163, 184, 0.25);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
      }

      h1 {
        margin-top: 0;
      }

      p {
        color: #cbd5e1;
        line-height: 1.6;
      }

      a {
        color: #67e8f9;
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>StreamList is offline</h1>
      <p>
        The application shell has been cached, but the requested network content
        is not currently available. Check your connection and try again.
      </p>
      <p>
        <a href="/">Return to StreamList</a>
      </p>
    </main>
  </body>
</html>
